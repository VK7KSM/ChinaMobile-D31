apply plugin: 'com.android.application'

android {
    namespace 'net.elfradio.d31system'
    compileSdk 34
    defaultConfig {
        applicationId 'net.elfradio.d31system'
        minSdk 23
        targetSdk 27
        versionCode 5
        versionName '1.0.4'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('D31_SIGNING_KEYSTORE') ?: '../../../missing-signing-key')
            storePassword System.getenv('D31_SIGNING_STORE_PASSWORD')
            keyAlias System.getenv('D31_SIGNING_KEY_ALIAS')
            keyPassword System.getenv('D31_SIGNING_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { disable 'ExpiredTargetSdkVersion' }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
